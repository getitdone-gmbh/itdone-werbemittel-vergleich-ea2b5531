<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werbemittel-Vergleich – Die 50 größten deutschen Hersteller im Überblick</title>
<meta name="description" content="Durchsuche und vergleiche Werbeartikel der größten deutschen Werbemittelhersteller nach Lagerbestand, Lieferzeit und Bewertung.">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <div class="brand">
      <span class="brand-mark">W</span>
      <div>
        <p class="brand-name">Werbemittel-Vergleich</p>
        <p class="brand-tag">Katalog der 50 größten deutschen Hersteller</p>
      </div>
    </div>
    <p class="header-hint">Suche z.&nbsp;B. „Kugelschreiber", „Tassen fürs Büro" oder „Regenschirm"</p>
  </div>
</header>

<section class="search-hero">
  <div class="wrap">
    <form id="search-form" class="search-form">
      <input id="search-input" type="text" placeholder="Was suchst du? z. B. Kugelschreiber, Trinkflaschen, Poloshirts …" autocomplete="off">
      <button type="submit">Suchen</button>
    </form>
    <div class="chip-row" id="category-chips"></div>
  </div>
</section>

<main class="wrap main-grid">
  <aside class="filters" id="filters">
    <h2>Filter</h2>

    <label class="filter-block">
      <span>Lagerbestand</span>
      <select id="filter-stock">
        <option value="0">Alle</option>
        <option value="1">Auf Lager (&gt; 0)</option>
        <option value="100">Mehr als 100 Stück</option>
        <option value="500">Mehr als 500 Stück</option>
        <option value="1000">Mehr als 1.000 Stück</option>
      </select>
    </label>

    <label class="filter-block">
      <span>Lieferzeit</span>
      <select id="filter-delivery">
        <option value="99">Alle</option>
        <option value="3">Bis 3 Tage</option>
        <option value="7">Bis 7 Tage</option>
        <option value="14">Bis 14 Tage</option>
      </select>
    </label>

    <label class="filter-block">
      <span>Produktbewertung</span>
      <select id="filter-rating">
        <option value="0">Alle</option>
        <option value="3">Ab 3,0 Sterne</option>
        <option value="4">Ab 4,0 Sterne</option>
        <option value="4.5">Ab 4,5 Sterne</option>
      </select>
    </label>

    <label class="filter-block">
      <span>Sortierung</span>
      <select id="filter-sort">
        <option value="relevance">Relevanz</option>
        <option value="rating">Beste Bewertung</option>
        <option value="delivery">Kürzeste Lieferzeit</option>
        <option value="price">Günstigster Preis</option>
        <option value="stock">Größter Lagerbestand</option>
      </select>
    </label>

    <button type="button" id="reset-filters" class="btn-ghost">Filter zurücksetzen</button>
  </aside>

  <section class="results">
    <div class="results-head">
      <p id="results-count">Lade Katalog …</p>
    </div>
    <div id="results-grid" class="results-grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Beispielkatalog zu Demonstrationszwecken · Preise pro Stück ab Mindestbestellmenge, netto zzgl. Druckkosten.</p>
  </div>
</footer>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close" aria-label="Schließen">×</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
